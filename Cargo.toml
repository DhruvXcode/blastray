[package]
name = "blastray"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A tiny native code-intelligence engine for coding agents."
repository = "https://github.com/DhruvXcode/blastray"
homepage = "https://github.com/DhruvXcode/blastray"
readme = "README.md"
keywords = ["code-intelligence", "mcp", "developer-tools", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
blake3 = "1.8.3"
bincode = "1.3.3"
ignore = "0.4.25"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tree-sitter = "0.25.10"
tree-sitter-javascript = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[[bin]]
name = "blastray"
path = "src/main.rs"
