name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/blastray --help
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/blastray.exe --help
      - if: runner.os == 'Linux'
        run: |
          temp=$(mktemp -d)
          mkdir "$temp/repo"
          printf 'export function answer() {}\n' > "$temp/repo/main.ts"
          (cd "$temp/repo" && "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/blastray" find answer)
          test -f "$temp/repo/.blastray/index.bin"
      - if: matrix.archive == 'tar.gz'
        run: tar -czf blastray-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release blastray -C "$GITHUB_WORKSPACE" LICENSE
      - if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/blastray.exe,LICENSE -DestinationPath blastray-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blastray-${{ matrix.target }}
          path: blastray-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
